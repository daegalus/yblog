name: Build and Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  deployments: write

concurrency:
  group: bunny-sites-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore cached images
        id: restore-cached-images
        uses: actions/cache/restore@v6
        with:
          path: |
            public/images
            cache/images.json
          # Key on the actual source images (they live in data/content/images, not
          # data/content/blog/images — the old glob matched nothing). restore-keys
          # falls back to the most recent cache so a single changed image doesn't
          # discard everything; the build's per-image hash check re-encodes only what changed.
          key: images-${{ hashFiles('data/content/images/**') }}
          restore-keys: |
            images-

      - name: Download Earthdate
        id: download-earthdate
        run: wget -O earthdate https://github.com/daegalus/earthdate/releases/latest/download/earthdate-linux-x86_64

      - name: Fix Permissions
        run: chmod +x earthdate

      - name: Get earthdate
        id: earthdate
        run: echo "earthdate=$(./earthdate)" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install native image encoders
        # The Go encoders use these when present, avoiding expensive WASM
        # fallback work on an empty GitHub Actions image cache.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libavif-dev libjxl-dev libwebp-dev
      
      - name: "Build"
        run: go run yblog.go deploy

      - name: Save image cache
        id: save-image-cache
        uses: actions/cache/save@v6
        with:
          path: |
            public/images
            cache/images.json
          key: ${{ steps.restore-cached-images.outputs.cache-primary-key }}
  

      - name: "Compress"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # Archive the dir itself, not public/* — the shell glob skips dotfiles,
        # which would drop passthrough entries like public/.well-known from the release.
        run: tar -cJf website.tar.zst public

      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.earthdate.outputs.earthdate }}
          tag_name: ${{ steps.earthdate.outputs.earthdate }}
          files: |
            website.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: public
          include-hidden-files: true
          retention-days: 7

      - uses: BunnyWay/actions/deploy-site@deploy-site_0.1.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          site: digital-garden
          directory: public
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          cli_version: "0.19.0"

